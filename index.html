<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comment Labeling</title>
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e2e1dc; --accent: #2f5d8a; --accent-text: #ffffff;
    --final: #fff8e6; --final-line: #e8c76a; --ok: #2e7d4f; --warn: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1f1f1d; --text: #ecebe6; --muted: #a3a29b;
      --line: #34332f; --accent: #7fb0e0; --accent-text: #10161c;
      --final: #2b2616; --final-line: #8a7230; --ok: #6fcf97; --warn: #f0b35a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 8px 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 12px 0; }

  header.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }

  .turn { padding: 10px 12px; border-left: 3px solid var(--line); margin: 0 0 10px; }
  .turn .who { font-weight: 600; font-size: 0.85rem; color: var(--muted); margin-bottom: 2px; }
  .turn .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .turn.final { background: var(--final); border-left-color: var(--final-line); border-radius: 0 6px 6px 0; }
  .turn.final .who { color: var(--text); }
  .scroll { max-height: 55vh; overflow-y: auto; }

  .q { margin: 14px 0; }
  .q .label { font-weight: 600; margin-bottom: 6px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts button {
    font: inherit; font-size: 0.95rem; padding: 8px 14px; min-height: 40px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--text); cursor: pointer;
  }
  .opts button:hover { border-color: var(--accent); }
  .opts button[aria-checked="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .opts button:focus-visible, .primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .primary {
    font: inherit; font-weight: 600; padding: 10px 22px; min-height: 44px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .primary:disabled { opacity: .4; cursor: not-allowed; }
  a { color: var(--accent); }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); }
  ul.raters { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  ul.raters a { display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); text-decoration: none; text-align: center; }
  .banner { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--warn); color: var(--warn); font-size: 0.9rem; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script src="config.js"></script>
<script src="data/raters.js"></script>
<script src="app.js"></script>
</body>
</html>
